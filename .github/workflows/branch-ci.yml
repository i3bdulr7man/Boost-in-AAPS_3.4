name: Build Boost APK
on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options: [fullRelease, fullDebug, pumpcontrolRelease]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 21          # 3.4.x требует JDK 21 (من jdk-map.json عندهم)
          distribution: temurin
          cache: gradle
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assemble${{ inputs.buildVariant }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boost-${{ inputs.buildVariant }}
          path: app/build/outputs/apk/**/*.apk
